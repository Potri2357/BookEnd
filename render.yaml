services:
  # 1. BookEnd Core FastAPI Backend
  - type: web
    name: bookend-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: APP_NAME
        value: BookEnd
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_PATH
        value: patchguard.duckdb
      - key: AUDIT_LEDGER_PATH
        value: audit_ledger.json
      - key: SIMULATED_BANNER
        value: "true"

  # 2. BookEnd React 19 Frontend
  - type: web
    name: bookend-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: bookend-backend
          property: host
