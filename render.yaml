services:
  # 1. BookEnd Core FastAPI Backend
  - type: web
    name: bookend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: backend
      - key: APP_NAME
        value: BookEnd
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_PATH
        value: patchguard.duckdb
      - key: AUDIT_LEDGER_PATH
        value: audit_ledger.json
      - key: SIMULATED_BANNER
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://book-end-pi.vercel.app,https://bookend-pp3k.onrender.com,https://bookend-frontend.onrender.com,http://localhost:5173,http://localhost:8008"
      - key: VERSION
        value: "3.4.1-enterprise"
      - key: AI_PROVIDER
        value: auto
      - key: WEBHOOK_TARGET_URL
        value: https://itsm.internal.local/webhook

  # 2. BookEnd React 19 Frontend
  - type: web
    name: bookend-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: VITE_API_BASE_URL
        value: https://bookend-pp3k.onrender.com/v1
