version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookend-backend
    restart: unless-stopped
    environment:
      - PORT=8008
      - HOST=0.0.0.0
      - APP_NAME=BookEnd
      - ENVIRONMENT=production
      - DATABASE_PATH=/app/data/patchguard.duckdb
      - AUDIT_LEDGER_PATH=/app/data/audit_ledger.json
      - DEFAULT_LOOKBACK_DAYS=45
      - COVERAGE_THRESHOLD=0.85
      - SIMULATED_BANNER=true
      - VERSION=3.4.1-enterprise
      - CORS_ALLOWED_ORIGINS=https://book-end-pi.vercel.app,https://bookend-pp3k.onrender.com,http://localhost:5173,http://localhost:8008,http://127.0.0.1:5173,http://127.0.0.1:8008
      - AI_PROVIDER=auto
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - WEBHOOK_TARGET_URL=${WEBHOOK_TARGET_URL:-https://itsm.internal.local/webhook}
    volumes:
      - bookend-storage:/app/data
    ports:
      - "8008:8008"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookend-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  bookend-storage:
