name: Postern Assurance CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-assurance:
    name: Backend Test Suite & Security Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Backend Pytest Suite
        run: |
          pytest backend/tests -v

      - name: Test Standalone Verification CLI
        run: |
          python verify_proofpack.py --help

  frontend-assurance:
    name: Frontend Test Suite & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Oxlint Linter
        working-directory: frontend
        run: npm run lint

      - name: Run Vitest Suite
        working-directory: frontend
        run: npm test

      - name: Validate Production Build
        working-directory: frontend
        run: npm run build
