<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Postern | Cryptographic Patch Assurance & Forensic Gate</title>
    <meta name="description" content="Postern closes the gap between 'we patched' and 'we are safe'. Air-gapped forensic hunting, deterministic DuckDB columnar analysis, automated patch gates, and RFC 8785 Ed25519 signed digital proof packs." />
    <meta name="theme-color" content="#F4F7FC" />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('postern_theme_mode');
          if (mode === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph / Facebook -->

    <meta property="og:image" content="https://postern-five.vercel.app/favicon.svg" />
